name: Update DeFi data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: ton-defi-data-update
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build collector data
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
          TON_RPC_URL: ${{ secrets.TON_RPC_URL }}
        run: npm run build

      - name: Commit changed public data
        run: |
          git add data public/data
          if git diff --cached --quiet; then
            echo "No publishable data changes"
            exit 0
          fi
          git config user.name "TON DeFi Believers Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(data): refresh DeFi metrics"
          git push
