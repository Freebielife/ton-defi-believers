name: Update DeFi data

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "collector/**"
      - "config/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: ton-defi-data-update
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test collector adapters
        run: npm run test:adapters

      - name: Build collector data
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
          TON_RPC_URL: ${{ secrets.TON_RPC_URL }}
        run: npm run build

      - name: Commit changed public data
        run: |
          git add data public RESISTANCE_UPLOAD
          if git diff --cached --quiet; then
            echo "No publishable data changes"
            exit 0
          fi

          git config user.name "TON DeFi Believers Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(data): refresh DeFi metrics"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi

            git rebase --abort || true
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done

          echo "Could not publish generated data after 3 attempts."
          exit 1
